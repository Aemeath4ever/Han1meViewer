permissions:
  contents: write
name: CI

# 说明：
#  - 不使用 actions/upload-artifact，构建产物直接发布到 Releases，不占 Artifacts 存储。
#    因此工作流里没有 retention-days（那是 Artifacts 的参数）。
#  - debug 构建发布到滚动 tag（默认 debug-latest，预发布）；release 构建每个版本一个 tag。
on:
  workflow_dispatch:
    inputs:
      build_type:
        description: '构建类型'
        type: choice
        options:
          - release
          - debug
          - both
        default: release
      release_notes:
        description: '更新内容（Markdown，留空则自动生成）'
        type: string
        required: false
      tag:
        description: 'Release tag（可选；release 默认 v<版本号>，debug 默认 debug-latest）'
        type: string
        required: false
      prerelease:
        description: '标记为预发布（debug 固定为预发布）'
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}-${{ inputs.build_type }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Load Google Services File
        env:
          DATA: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: echo "$DATA" | base64 -di > app/google-services.json

      - name: Grant execute permission
        run: chmod +x gradlew scripts/publish-release.sh

      - name: Decode keystore
        env:
          KEYSTORE: ${{ secrets.YOUR_KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$HOME/.android"
          printf '%s' "$KEYSTORE" | base64 -d > "$HOME/.android/keystore.jks"

      - name: Write release notes
        env:
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: printf '%s' "$RELEASE_NOTES" > "$RUNNER_TEMP/release-notes.md"

      # ---------- release ----------
      - name: Build release APK
        if: inputs.build_type == 'release' || inputs.build_type == 'both'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.YOUR_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          HA_GITHUB_TOKEN: ${{ secrets.HA_GITHUB_TOKEN }}
          HA1_VERSION_SOURCE: 'ci'
        run: ./gradlew assembleRelease

      - name: Publish release APK
        if: inputs.build_type == 'release' || inputs.build_type == 'both'
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          apk=$(ls app/build/outputs/apk/release/Han1meViewer-v*.apk | head -1)
          version=$(basename "$apk" .apk | sed -E 's/^Han1meViewer-v//; s/-arm64-v8a$//')
          tag="${INPUT_TAG:-v$version}"
          args=()
          if [ "$PRERELEASE" = "true" ]; then args+=(--prerelease); fi
          ./scripts/publish-release.sh \
            --tag "$tag" --title "$version" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            "${args[@]}" -- "$apk"

      # ---------- debug ----------
      # debug 也用 release keystore 签名：CI 的 debug keystore 每次都不同，
      # 不固定签名会导致覆盖安装失败（applicationId 带 .debug，可与 release 共存）。
      - name: Build debug APK
        if: inputs.build_type == 'debug' || inputs.build_type == 'both'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.YOUR_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          HA_GITHUB_TOKEN: ${{ secrets.HA_GITHUB_TOKEN }}
          HA1_VERSION_SOURCE: 'debug'
        run: ./gradlew assembleDebug -PciDebugSigning=true

      - name: Publish debug APK
        if: inputs.build_type == 'debug' || inputs.build_type == 'both'
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          apk=$(ls app/build/outputs/apk/debug/Han1meViewer-v*.apk | head -1)
          version=$(basename "$apk" .apk | sed -E 's/^Han1meViewer-v//; s/-arm64-v8a$//')
          sha=${GITHUB_SHA::7}
          tag="${INPUT_TAG:-debug-latest}"
          ./scripts/publish-release.sh \
            --tag "$tag" --title "Debug build $version ($sha)" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --prerelease -- "$apk"
