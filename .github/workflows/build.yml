permissions:
  contents: write
name: Build & Release

# 说明：
#  - release 与 debug 合并在本工作流里（替代原来的 ci.yml），不再拆成两个流程。
#  - 构建产物不走 actions/upload-artifact，直接交给 scripts/publish-release.sh 上传到
#    Releases，不占用 Artifacts 存储（因此没有 retention-days 可设）。
#  - build_type=both：release 与 debug 的 APK 一起挂到**同一个** Release（tag 为 v<版本号>），
#    两个 APK 文件名本来就不同（release 带 -arm64-v8a 后缀，debug 是 debug+1），不会互相覆盖。
#  - build_type=release：只发正式版，tag 默认 v<版本号>。
#  - build_type=debug：只发 debug，tag 默认 debug-latest（滚动更新，预发布）。
on:
  workflow_dispatch:
    inputs:
      build_type:
        description: '构建类型（both 会把 release 与 debug 发到同一个 Release）'
        type: choice
        options:
          - both
          - release
          - debug
        default: both
      release_notes:
        description: '更新内容（Markdown，留空则自动生成）'
        type: string
        required: false
      tag:
        description: 'Release tag（可选；release/both 默认 v<版本号>，debug 默认 debug-latest）'
        type: string
        required: false
      prerelease:
        description: '标记为预发布（debug 固定为预发布）'
        type: boolean
        default: false

concurrency:
  group: build-${{ github.ref }}-${{ inputs.build_type }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Load Google Services File
        env:
          DATA: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: echo "$DATA" | base64 -di > app/google-services.json

      - name: Grant execute permission
        run: chmod +x gradlew scripts/publish-release.sh

      - name: Decode keystore
        env:
          KEYSTORE: ${{ secrets.YOUR_KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$HOME/.android"
          printf '%s' "$KEYSTORE" | base64 -d > "$HOME/.android/keystore.jks"

      - name: Write release notes
        env:
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: printf '%s' "$RELEASE_NOTES" > "$RUNNER_TEMP/release-notes.md"

      # ---------- 构建 ----------
      - name: Build release APK
        if: inputs.build_type == 'release' || inputs.build_type == 'both'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.YOUR_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          HA_GITHUB_TOKEN: ${{ secrets.HA_GITHUB_TOKEN }}
          HA1_VERSION_SOURCE: 'ci'
        run: ./gradlew assembleRelease

      # debug 也用 release keystore 签名：CI 的 debug keystore 每次都不同，
      # 不固定签名会导致覆盖安装失败（applicationId 带 .debug，可与 release 共存）。
      - name: Build debug APK
        if: inputs.build_type == 'debug' || inputs.build_type == 'both'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.YOUR_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          HA_GITHUB_TOKEN: ${{ secrets.HA_GITHUB_TOKEN }}
          HA1_VERSION_SOURCE: 'debug'
        run: ./gradlew assembleDebug -PciDebugSigning=true

      # ---------- 发布 ----------
      # 一个 step 统一处理三种模式：both 时把两个 APK 交给同一次 publish-release 调用，
      # 这样只创建/更新一个 Release，避免两次调用各自建 tag。
      # 配了 PUBLIC_REPO_TOKEN 时，同一批产物再镜像到公开仓：应用内的更新检查读的就是公开仓
      # （私有仓的 Releases 只有维护者可见），所以两边必须一起发，否则更新检查会 404。
      - name: Publish to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLIC_REPO: RinggaV/Han1meViewer-public
          PUBLIC_REPO_TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}
          BUILD_TYPE: ${{ inputs.build_type }}
          INPUT_TAG: ${{ inputs.tag }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail

          release_apk() {
            ls app/build/outputs/apk/release/Han1meViewer-v*.apk | head -1
          }
          debug_apk() {
            ls app/build/outputs/apk/debug/Han1meViewer-v*.apk | head -1
          }
          version_of() {
            basename "$1" .apk | sed -E 's/^Han1meViewer-v//; s/-arm64-v8a$//'
          }

          files=()
          prerel=()
          case "$BUILD_TYPE" in
            both)
              rel=$(release_apk)
              dbg=$(debug_apk)
              version=$(version_of "$rel")
              tag="${INPUT_TAG:-v$version}"
              title="$version"
              files=("$rel" "$dbg")
              if [ "$PRERELEASE" = "true" ]; then prerel=(--prerelease); fi
              ;;

            release)
              rel=$(release_apk)
              version=$(version_of "$rel")
              tag="${INPUT_TAG:-v$version}"
              title="$version"
              files=("$rel")
              if [ "$PRERELEASE" = "true" ]; then prerel=(--prerelease); fi
              ;;

            debug)
              dbg=$(debug_apk)
              version=$(version_of "$dbg")
              tag="${INPUT_TAG:-debug-latest}"
              title="Debug build $version (${GITHUB_SHA::7})"
              files=("$dbg")
              prerel=(--prerelease)
              ;;

            *)
              echo "未知的 build_type: $BUILD_TYPE" >&2
              exit 2
              ;;
          esac

          # $1 = 该仓库可用的 token，其余参数原样传给脚本（如 --repo）
          publish() {
            local token="$1"
            shift
            GH_TOKEN="$token" ./scripts/publish-release.sh \
              --tag "$tag" --title "$title" \
              --notes-file "$RUNNER_TEMP/release-notes.md" \
              "${prerel[@]}" "$@" -- "${files[@]}"
          }

          publish "$GH_TOKEN"

          if [ -z "${PUBLIC_REPO_TOKEN:-}" ] || [ -z "${PUBLIC_REPO:-}" ]; then
            echo "[publish] 未配置 PUBLIC_REPO_TOKEN，跳过公开仓镜像"
          else
            publish "$PUBLIC_REPO_TOKEN" --repo "$PUBLIC_REPO"
          fi
